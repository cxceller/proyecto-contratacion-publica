# Tema global de la app: paleta unica compartida por todo (Streamlit +
# graficos Plotly + CSS propio en app_ui.py). Regla: azul #2a78d6 (=
# primaryColor) para datos y boton primario; naranja #eb6834 exclusivo
# para destacar el maximo de un grafico o para alertas; neutros (fondo/
# texto) segun este bloque; para estados usa verde #0ca30c (ok), ambar
# #fab219 (aviso) y rojo #d03b3b (critico) -- siempre junto a icono +
# etiqueta, nunca color solo (ver ICONOS_ESTADO en app_ui.py).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

# pages/Reportes.py agrega una segunda pagina de Streamlit (URL /Reportes,
# ver ui/reportes.py) -- sin esto, Streamlit muestra su propio widget de
# navegacion automatico entre paginas arriba del sidebar personalizado de
# cada una (render_navegacion_sidebar en app_ui.py / ui/reportes.py),
# duplicando la navegacion.
[client]
showSidebarNavigation = false
showErrorDetails = "none"
toolbarMode = "viewer"

# Seguridad (security-guard): no mostrar trazas/rutas al usuario (el detalle
# va al logger, ver src/logging_config.py); tope de subida de 10 MB para los
# importadores .xlsx/.csv/.txt (el default de Streamlit son 200 MB); sin
# telemetria. XSRF y CORS quedan en su default seguro (true). Streamlit >= 1.5x acepta
# "none" (en 1.41 era booleano).
[server]
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
